name: DMARC4all check
description: Check public email-authentication DNS and emit stable findings
inputs:
  domain:
    description: Domain to check
    required: true
  fail-on:
    description: Lowest finding severity that fails the step (low, med, or high)
    required: false
    default: high
  selectors:
    description: Optional comma-separated DKIM selectors to observe
    required: false
    default: ''
  resolver:
    description: DNS-over-HTTPS JSON endpoint
    required: false
    default: https://cloudflare-dns.com/dns-query
outputs:
  report:
    description: Path to the generated JSON report
    value: ${{ steps.check.outputs.report }}
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Install pinned dependencies
      shell: bash
      run: npm ci --ignore-scripts --prefix "$GITHUB_ACTION_PATH/../../.."
    - name: Run DMARC4all check
      id: check
      shell: bash
      env:
        INPUT_DOMAIN: ${{ inputs.domain }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_SELECTORS: ${{ inputs.selectors }}
        INPUT_RESOLVER: ${{ inputs.resolver }}
      run: |
        report_path="${RUNNER_TEMP}/dmarc4all-report.json"
        selector_args=()
        IFS=',' read -ra selectors <<< "$INPUT_SELECTORS"
        for selector in "${selectors[@]}"; do
          selector="${selector//[[:space:]]/}"
          if [ -n "$selector" ]; then selector_args+=(--selector "$selector"); fi
        done
        set +e
        node "$GITHUB_ACTION_PATH/../../../bin/dmarc4all.js" check "$INPUT_DOMAIN" \
          "${selector_args[@]}" --resolver "$INPUT_RESOLVER" \
          --fail-on "$INPUT_FAIL_ON" --output "$report_path"
        status=$?
        set -e
        if [ -f "$report_path" ]; then
          echo "report=$report_path" >> "$GITHUB_OUTPUT"
        fi
        exit "$status"
